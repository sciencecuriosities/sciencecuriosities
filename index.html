<script>
document.addEventListener('DOMContentLoaded', () => {
  const menuButton = document.querySelector('.menu-toggle');
  const nav = document.getElementById('site-nav');
  
  // Use a generic handler to avoid double-firing
  let lastEventTime = 0;

  function handleInteraction(e, type) {
    const now = Date.now();
    // Prevent click and touch from firing within 500ms of each other
    if (now - lastEventTime < 500) return;
    lastEventTime = now;

    e.stopPropagation();
    
    // Toggle Logic
    if (e.currentTarget === menuButton) {
      const isOpen = nav.classList.toggle('open');
      menuButton.querySelector('.icon').textContent = isOpen ? '✕' : '☰';
    } else {
      const parent = e.currentTarget.closest('.has-submenu');
      if (parent) parent.classList.toggle('open');
    }
  }

  // Attach to the main button
  ['click', 'touchstart'].forEach(evt => {
    menuButton.addEventListener(evt, (e) => handleInteraction(e, 'main'), { passive: false });
  });

  // Attach to all submenu toggles (Ranges)
  document.querySelectorAll('.submenu-toggle').forEach(btn => {
    ['click', 'touchstart'].forEach(evt => {
      btn.addEventListener(evt, (e) => handleInteraction(e, 'sub'), { passive: false });
    });
  });

  // Outside click logic remains the same
  document.addEventListener('click', (e) => {
    if (!nav.contains(e.target) && !menuButton.contains(e.target)) {
      nav.classList.remove('open');
      document.querySelectorAll('.has-submenu').forEach(p => p.classList.remove('open'));
    }
  });
});
</script>

<script>
document.querySelectorAll('.submenu-toggle').forEach(button => {
  button.addEventListener('click', e => {
    e.stopPropagation(); // IMPORTANT
    const parent = button.closest('.has-submenu');
    const expanded = parent.classList.toggle('open');
    button.setAttribute('aria-expanded', expanded);
  });
});
</script>


</body>
